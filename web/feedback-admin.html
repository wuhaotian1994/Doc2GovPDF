<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>反馈处理 · 公文</title><link rel="stylesheet" href="write-feedback.css"></head><body class="feedback-admin"><header><div><h1>反馈处理</h1><p>原始反馈与附件仅供授权处理；公开研发记录须另行整理审查。</p></div><button type="button" class="feedback-quiet" id="feedback-admin-logout" hidden>退出处理</button></header><main><p role="status" aria-live="polite" class="feedback-admin-status" id="feedback-admin-status"></p><section class="feedback-admin-auth" id="feedback-admin-auth"><h2>使用处理人员凭据</h2><p>凭据只保留在本标签页内存中，不加入网址或浏览器长期存储。</p><label for="feedback-admin-token">处理人员私密凭据</label><input id="feedback-admin-token" type="password" autocomplete="off"><div class="feedback-admin-actions"><button type="button" class="feedback-primary" id="feedback-admin-connect">读取反馈列表</button></div></section><div id="feedback-admin-workspace" class="feedback-admin-columns" hidden><section class="feedback-admin-list"><h2>待处理反馈</h2><div id="feedback-admin-list"></div><div class="feedback-admin-actions"><button type="button" class="feedback-secondary" id="feedback-admin-prev">上一页</button><button type="button" class="feedback-secondary" id="feedback-admin-next">下一页</button><button type="button" class="feedback-secondary" id="feedback-admin-refresh">刷新列表</button></div></section><section class="feedback-admin-detail" id="feedback-admin-detail"><h2>选择一条反馈</h2><p>先了解工作目标与障碍，再接手、回复并关联修复版本。</p></section></div></main><script type="module" src="feedback-admin.js"></script></body></html>
